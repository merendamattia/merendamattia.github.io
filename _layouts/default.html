<!DOCTYPE html>
<html lang="{% if page.url contains '/uni/' %}it{% else %}{{ page.lang | default: site.lang | default: 'en' }}{% endif %}">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">

	<meta name="format-detection" content="telephone=no">
	{% if page.sitemap == false %}<meta name="robots" content="noindex,follow">{% endif %}

	<!-- AdSense -->
	<meta name="google-adsense-account" content="ca-pub-4879151575586815">
	<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4879151575586815"
		crossorigin="anonymous"></script>

	<!-- Rybbit tracking -->
	<script src="https://app.rybbit.io/api/script.js" data-site-id="607" defer></script>

	{% seo %}

	<link rel="icon" type="image/webp" sizes="64x64" href="{{ '/assets/images/favicon.webp' | relative_url }}">
	<link rel="preload" href="{{ '/assets/fonts/source-serif-4-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
	<link rel="preload" href="{{ '/assets/fonts/source-serif-4-latin-italic.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>

	<link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/assets/css/broadsheet.css">
	<link rel="stylesheet" href="{{ '/assets/vendor/phosphor/style.css' | relative_url }}">
	<script src="{{ site.baseurl }}/assets/js/broadsheet.js" defer></script>

	{% if page.mathjax %}
	<script>window.MathJax = { tex: { inlineMath: [['$', '$']] } };</script>
	<script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>
	{% endif %}
</head>

<body>
	<header class="masthead">
		<a class="brand" href="{{ site.baseurl }}/">Saverio Mattia <strong>Merenda</strong></a>
		<button class="menu-toggle" type="button" aria-controls="site-navigation" aria-expanded="false" aria-label="Open navigation">
			<i class="ph ph-list" aria-hidden="true"></i>
		</button>
		<nav id="site-navigation">
			<a class="navlink" href="{{ site.baseurl }}/" {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a>
			<a class="navlink curriculum-link" href="{{ site.baseurl }}/cv" target="_blank" rel="noopener">Curriculum</a>
			<a class="navlink" href="{{ site.baseurl }}/uni/" {% if page.url contains '/uni/' %}aria-current="page"{% endif %}>University notes</a>
			<a class="btn btn-primary" href="{{ site.baseurl }}/files/cv.pdf" target="_blank" rel="noopener"><i class="ph ph-file-pdf"></i>CV</a>
		</nav>
	</header>
	<hr class="rule-head" />

	{{ content }}

	<script src="https://cdn.websitepolicies.io/lib/cookieconsent/1.0.3/cookieconsent.min.js" defer></script>
	<script>window.addEventListener("load", function () { window.wpcc.init({ "corners": "small", "colors": { "popup": { "background": "#ffffff", "text": "#545454", "border": "#5e5e5e" }, "button": { "background": "#1297d1", "text": "#ffffff" } }, "position": "bottom", "border": "thin", "content": { "href": "https://www.cookiesandyou.com/", "message": "This website uses analytics cookies to ensure you get the best experience on our website." } }) });</script>
	<!-- Global site tag (gtag.js) - Google Analytics -->
	<script async src="https://www.googletagmanager.com/gtag/js?id=GTM-T4BG5FL"></script>
	<script>
		window.dataLayer = window.dataLayer || [];
		function gtag() { dataLayer.push(arguments); }
		gtag('js', new Date());

		gtag('config', 'GTM-T4BG5FL');
		gtag('set', 'anonymizeIp', true);
		gtag('require', 'eventTracker');
		gtag('require', 'outboundLinkTracker');
		gtag('require', 'urlChangeTracker');
		gtag('send', 'pageview');
	</script>
</body>

</html>
